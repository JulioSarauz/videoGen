name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Backend -> Render (deploy hook: Dashboard > servicio > Settings > Deploy Hook)
  deploy-render:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Falta el secret RENDER_DEPLOY_HOOK_URL"; exit 1; }
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

  # El frontend (Vercel, proyecto front-end-llm) se despliega con la integracion
  # Git nativa de Vercel al detectar el push a main; no requiere job aqui.
