services:
  - type: web
    name: genvideo
    runtime: node
    plan: free
    # El deploy lo dispara el pipeline de GitHub Actions (deploy hook) solo
    # cuando el CI pasa; por eso el auto-deploy nativo esta apagado.
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: COOKIE_SECURE
        value: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TEXT_MODEL
        value: openai/gpt-4o-mini
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MIN_LONG_EDGE_PX
        value: 1080
      - key: FIDELITY_MAX_DIFF
        value: 0.18
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_DAILY_QUOTA
        value: 20
      - key: MAX_AUDIO_MB
        value: 50
      - key: POLLINATIONS_BASE_URL
        value: https://image.pollinations.ai/prompt
