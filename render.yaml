services:
  - type: web
    name: genvideo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: COOKIE_SECURE
        value: true
      - key: KLING_API_KEY
        sync: false
      - key: KLING_BASE_URL
        value: https://api.klingai.com
      - key: KLING_IMAGE2VIDEO_PATH
        value: /v1/videos/image2video
      - key: KLING_IMAGE2VIDEO_STATUS_PATH
        value: /v1/videos/image2video
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MIN_LONG_EDGE_PX
        value: 1080
      - key: FIDELITY_MAX_DIFF
        value: 0.18
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_AUDIO_MB
        value: 25
      - key: POLLINATIONS_BASE_URL
        value: https://image.pollinations.ai/prompt
